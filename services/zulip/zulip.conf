[machine]
puppet_classes = zulip::profile::standalone_nodb,zulip::process_fts_updates
deploy_type = production

[postgresql]
version = 17
database_name = zulip
database_user = zulip

[application_server]
http_only = true

[loadbalancer]
# Partridge's LAN address. Do not trust arbitrary forwarded headers.
ips = 10.4.1.30
