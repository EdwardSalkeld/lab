version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The update-chatting workflow proposes each Chatting release itself.
      - dependency-name: chatting

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /tools/bitwarden-mirror
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /tools/grafana-alerting-lint
    schedule:
      interval: weekly
