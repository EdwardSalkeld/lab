name: webtrees-smoke

on:
  pull_request:
    paths:
      - '.github/workflows/webtrees-smoke.yml'
      - 'nixos/hosts/partridge/webtrees.nix'
      - 'nixos/hosts/partridge/webtrees-bootstrap.php'
      - 'nixos/hosts/partridge/secrets/webtrees.yaml'
      - 'flake.lock'
      - 'scripts/check-webtrees.py'

jobs:
  native-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            http2 = false
            fallback = true
      - name: Declarative config, bootstrap retry, failure isolation, login, tree and restart
        run: python3 scripts/check-webtrees.py
