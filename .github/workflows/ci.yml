name: ci

on:
  pull_request:

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - '.github/workflows/**'
              - 'terraform/**'
            nix:
              - '.github/workflows/**'
              - '.sops.yaml'
              - 'flake.lock'
              - 'flake.nix'
              - 'nixos/**'
              - 'tools/**'

  terraform:
    name: terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false
      - name: terraform validate
        run: terraform -chdir=terraform validate
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          github_token: ${{ github.token }}
          working_directory: terraform

  terraform-plan:
    name: terraform-plan
    needs:
      - changes
      - terraform
    if: needs.changes.outputs.terraform == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: fourth.ts.alcachofa.faith

      - name: install ssh key
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${{ secrets.FOURTH_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy

      - name: trigger terraform plan on the orchestrator
        run: |
          set +e
          output="$(ssh \
            -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            deploy@fourth.ts.alcachofa.faith \
            plan-terraform \
              "${{ github.event.pull_request.number }}" \
              "${{ github.event.pull_request.head.sha }}" 2>&1)"
          rc=$?
          set -e

          printf '%s\n' "$output"
          if [[ "$rc" -ne 0 && "$output" == *"no deploy/plan-terraform.sh"* ]]; then
            echo "::notice::fourth does not have deploy/plan-terraform.sh yet; this PR installs it for future PRs"
            exit 0
          fi

          exit "$rc"

  nix:
    name: nix
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # cache.nixos.org intermittently corrupts zstd NARs over HTTP/2
            # ("Stream error in the HTTP/2 framing layer"); force HTTP/1.1 and
            # fall back to building from source if a substitute still fails.
            http2 = false
            fallback = true
      - name: flake check
        run: nix flake check --no-update-lock-file
      - name: build partridge
        run: nix build .#nixosConfigurations.partridge.config.system.build.toplevel -o /tmp/pr-system
      - name: build main partridge
        run: |
          git fetch origin main
          git worktree add /tmp/main-worktree origin/main
          nix build /tmp/main-worktree#nixosConfigurations.partridge.config.system.build.toplevel -o /tmp/main-system
      - name: partridge closure diff
        run: nix store diff-closures /tmp/main-system /tmp/pr-system
