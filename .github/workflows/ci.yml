name: ci

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      deploy: ${{ steps.filter.outputs.deploy }}
      nix: ${{ steps.filter.outputs.nix }}
      nix_shared: ${{ steps.filter.outputs.nix_shared }}
      nix_flake: ${{ steps.filter.outputs.nix_flake }}
      nix_lock: ${{ steps.filter.outputs.nix_lock }}
      nix_host_files: ${{ steps.filter.outputs.nix_host_files }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: json
          filters: |
            terraform:
              - '.github/workflows/**'
              - 'terraform/**'
            deploy:
              - '.github/workflows/**'
              - 'deploy/**'
              - 'proxmox/**'
              - 'scripts/*.sh'
              - 'terraform/**'
            nix:
              - '.github/workflows/**'
              - '.sops.yaml'
              - 'deploy/nix-*.sh'
              - 'flake.lock'
              - 'flake.nix'
              - 'nixos/**'
              - 'pkgs/**'
              - 'tools/**'
              - 'scripts/bootstrap-ci-deploy.sh'
              - 'scripts/check-*.py'
            nix_shared:
              - '.github/workflows/**'
              - '.sops.yaml'
              - 'nixos/modules/**'
              - 'pkgs/**'
              - 'tools/**'
              - 'scripts/bootstrap-ci-deploy.sh'
              - 'scripts/check-*.py'
            nix_flake:
              - 'flake.nix'
            nix_lock:
              - 'flake.lock'
            nix_host:
              - 'nixos/hosts/**'

  nix_hosts:
    name: nix-hosts
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.select.outputs.hosts }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # cache.nixos.org intermittently corrupts zstd NARs over HTTP/2
            # ("Stream error in the HTTP/2 framing layer"); force HTTP/1.1 and
            # fall back to building from source if a substitute still fails.
            http2 = false
            fallback = true
      - name: select NixOS hosts
        id: select
        env:
          NIX_SHARED: ${{ needs.changes.outputs.nix_shared }}
          NIX_FLAKE: ${{ needs.changes.outputs.nix_flake }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NIX_LOCK: ${{ needs.changes.outputs.nix_lock }}
          NIX_HOST_FILES: ${{ needs.changes.outputs.nix_host_files }}
        run: |
          mapfile -t all_hosts < <(nix eval --no-update-lock-file --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          test "${#all_hosts[@]}" -gt 0
          hosts=()

          # A chatting or bbmb release bump changes only that input's url line,
          # so the lock diff below can pick its host. Any other flake.nix edit
          # builds every host.
          flake_shared=false
          if [[ "$NIX_FLAKE" == "true" ]]; then
            flake_shared=true
            if [[ "$NIX_LOCK" == "true" ]]; then
              changed_lines="$(git diff --unified=0 "$BASE_SHA" HEAD -- flake.nix \
                | awk '/^@@/ { hunk = 1; next } hunk && /^[-+]/')"
              pin_line='^[-+][[:space:]]*(chatting\.)?url = "github:EdwardSalkeld/(chatting|bbmb)/[A-Za-z0-9._-]+";[[:space:]]*$'
              if [[ -n "$changed_lines" ]] && ! grep -qvE "$pin_line" <<<"$changed_lines"; then
                flake_shared=false
              fi
            fi
          fi

          if [[ "$NIX_SHARED" == "true" || "$flake_shared" == "true" ]]; then
            hosts=("${all_hosts[@]}")
          else
            mapfile -t changed_hosts < <(jq -r '.[] | split("/")[2]' <<<"${NIX_HOST_FILES:-[]}")
            hosts+=("${changed_hosts[@]}")

            if [[ "$NIX_LOCK" == "true" ]]; then
              base_lock="$(mktemp)"
              git show "${BASE_SHA}:flake.lock" > "$base_lock"

              changed_inputs="$({
                jq -r --slurpfile base "$base_lock" '
                  . as $head
                  | $base[0] as $base
                  | (($base.nodes.root.inputs // {}) | keys) as $baseInputs
                  | (($head.nodes.root.inputs // {}) | keys) as $headInputs
                  | (($baseInputs + $headInputs) | unique[]) as $input
                  | ($base.nodes.root.inputs[$input] // null) as $baseNode
                  | ($head.nodes.root.inputs[$input] // null) as $headNode
                  | select(
                      $baseNode != $headNode
                      or ($base.nodes[$baseNode] != $head.nodes[$headNode])
                    )
                  | $input
                ' flake.lock
              } | sort -u)"
              rm -f "$base_lock"

              # A lock change which cannot be attributed to a known host input
              # is shared by default. This keeps the narrow cases fast without
              # allowing an indirect dependency change to skip a needed build.
              shared_lock_change=false
              while IFS= read -r input; do
                case "$input" in
                  media-collection-manager)
                    hosts+=(kite)
                    ;;
                  bbmb | chatting)
                    hosts+=(magpie)
                    ;;
                  exercise-tracker | linear-export | octopus-dl)
                    hosts+=(partridge)
                    ;;
                  nixpkgs | nixpkgs-unstable | sops-nix | "")
                    shared_lock_change=true
                    ;;
                  *)
                    shared_lock_change=true
                    ;;
                esac
              done <<< "$changed_inputs"

              if [[ "$shared_lock_change" == "true" ]]; then
                hosts=("${all_hosts[@]}")
              fi
            fi
          fi

          # Drops nixos/hosts/ directories and lock inputs of hosts the flake
          # no longer defines.
          all_json="$(printf '%s\n' "${all_hosts[@]}" | jq -R . | jq -cs .)"
          printf '%s\n' "${hosts[@]}" | jq -R 'select(. != "")' \
            | jq -cs --argjson all "$all_json" 'unique | map(select(IN($all[])))' \
            | sed 's/^/hosts=/' >> "$GITHUB_OUTPUT"

  terraform_validate:
    name: terraform-validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup terraform
        uses: hashicorp/setup-terraform@v4
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false
      - name: terraform validate
        run: terraform -chdir=terraform validate
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          github_token: ${{ github.token }}
          working_directory: terraform

  terraform-plan:
    name: terraform-plan
    needs:
      - changes
      - terraform_validate
    # Dependabot PRs get no repository secrets, so Tailscale cannot connect.
    if: >-
      needs.changes.outputs.terraform == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: fourth.ts.alcachofa.faith

      - name: install ssh key
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${{ secrets.FOURTH_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy

      - name: trigger terraform plan on the orchestrator
        run: |
          set +e
          output="$(ssh \
            -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            deploy@fourth.ts.alcachofa.faith \
            plan-terraform \
              "${{ github.event.pull_request.number }}" \
              "${{ github.event.pull_request.head.sha }}" 2>&1)"
          rc=$?
          set -e

          printf '%s\n' "$output"
          if [[ "$rc" -ne 0 && "$output" == *"no deploy/plan-terraform.sh"* ]]; then
            echo "::notice::fourth does not have deploy/plan-terraform.sh yet; this PR installs it for future PRs"
            exit 0
          fi

          exit "$rc"

  deploy_scripts:
    name: deploy-scripts
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck \
            deploy/*.sh \
            scripts/*.sh \
            proxmox/journal-to-loki/install.sh \
            proxmox/luna/network-watchdog/install.sh \
            proxmox/luna/network-watchdog/luna-network-watchdog \
            proxmox/luna/network-watchdog/luna-network-watchdog.conf
      - name: Terraform plan guard fixtures and coverage
        run: scripts/check-terraform-plan-guard.sh

  # Only this job and nix are required checks, so it reports the deploy script
  # checks as well as Terraform validation.
  terraform:
    name: terraform
    needs:
      - changes
      - terraform_validate
      - deploy_scripts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify Terraform and deploy script jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          TERRAFORM_CHANGED: ${{ needs.changes.outputs.terraform }}
          TERRAFORM_VALIDATE: ${{ needs.terraform_validate.result }}
          DEPLOY_CHANGED: ${{ needs.changes.outputs.deploy }}
          DEPLOY_SCRIPTS: ${{ needs.deploy_scripts.result }}
        run: |
          if [[ "$CHANGES" != "success" ]]; then
            echo "changes result: $CHANGES" >&2
            exit 1
          fi

          status=0
          if [[ "$TERRAFORM_CHANGED" == "true" && "$TERRAFORM_VALIDATE" != "success" ]]; then
            echo "terraform-validate result: $TERRAFORM_VALIDATE" >&2
            status=1
          fi
          if [[ "$DEPLOY_CHANGED" == "true" && "$DEPLOY_SCRIPTS" != "success" ]]; then
            echo "deploy-scripts result: $DEPLOY_SCRIPTS" >&2
            status=1
          fi
          exit "$status"

  nix_checks:
    name: nix-checks
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # cache.nixos.org intermittently corrupts zstd NARs over HTTP/2
            # ("Stream error in the HTTP/2 framing layer"); force HTTP/1.1 and
            # fall back to building from source if a substitute still fails.
            http2 = false
            fallback = true
      - name: configure read-only Lab cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.LAB_NIX_CACHE_NAME }}
          # Deploy publishes the checks; PRs only consume them.
          skipPush: true
      - name: flake check
        run: nix flake check --no-update-lock-file
      - name: deployment refusal and recovery checks
        run: python3 scripts/check-ci-deploy.py
      - name: fourth's host allowlists match the flake
        run: python3 scripts/check-host-lists.py
      - name: Kite backup continuity and mount guards
        run: python3 scripts/check-kite-backups.py
      - name: FreshRSS backup under live writes
        run: |
          script="$(mktemp)"
          nix eval --raw .#nixosConfigurations.falcon.config.systemd.services.freshrss-sqlite-backup.script > "$script"
          python3 scripts/check-freshrss-backup.py "$script"

  nixos_build:
    name: nixos-build (${{ matrix.host }})
    needs: nix_hosts
    if: needs.nix_hosts.outputs.hosts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.nix_hosts.outputs.hosts) }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # cache.nixos.org intermittently corrupts zstd NARs over HTTP/2
            # ("Stream error in the HTTP/2 framing layer"); force HTTP/1.1 and
            # fall back to building from source if a substitute still fails.
            http2 = false
            fallback = true
      - name: configure read-only Lab cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.LAB_NIX_CACHE_NAME }}
          # Deploy publishes the shared cache; PRs only consume it.
          skipPush: true
      - name: build ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel -o /tmp/pr-system
      - name: build main ${{ matrix.host }}
        run: |
          git fetch origin main
          git worktree add /tmp/main-worktree origin/main
          nix build /tmp/main-worktree#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel -o /tmp/main-system
      - name: ${{ matrix.host }} closure diff
        env:
          HOST: ${{ matrix.host }}
        run: |
          diff="$(nix store diff-closures /tmp/main-system /tmp/pr-system)"
          printf '%s\n' "$diff"
          {
            echo "### ${HOST} closure diff"
            echo
            if [[ -n "$diff" ]]; then
              echo '```'
              printf '%s\n' "$diff"
              echo '```'
            else
              echo 'No closure changes.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  nix:
    name: nix
    needs:
      - changes
      - nix_checks
      - nix_hosts
      - nixos_build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verify Nix jobs
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes result: ${{ needs.changes.result }}" >&2
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.nix }}" != "true" ]]; then
            echo "No Nix changes."
            exit 0
          fi

          nix_checks="${{ needs.nix_checks.result }}"
          nix_hosts="${{ needs.nix_hosts.result }}"
          nixos_build="${{ needs.nixos_build.result }}"

          if [[ "$nix_checks" != "success" ]]; then
            echo "nix-checks result: $nix_checks" >&2
            exit 1
          fi

          if [[ "$nix_hosts" != "success" ]]; then
            echo "nix-hosts result: $nix_hosts" >&2
            exit 1
          fi

          case "$nixos_build" in
            success | skipped)
              ;;
            *)
              echo "nixos-build result: $nixos_build" >&2
              exit 1
              ;;
          esac
