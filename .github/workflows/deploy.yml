name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_only:
        description: Publish closures and bootstrap manifest without Terraform or host switches
        type: boolean
        default: false

# Serialize deploys; never cancel an in-flight one (would leave a half-applied
# terraform run / rebuild / dangling state lock). GitHub keeps only the newest
# pending run and cancels older pending ones, so a burst of merges deploys just
# the latest commit. Each run deploys the exact commit it built.
concurrency:
  group: deploy-lab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-systems:
    name: build and publish NixOS systems
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.build.outputs.systems }}
    steps:
      - name: require cache configuration
        env:
          CACHE_NAME: ${{ vars.LAB_NIX_CACHE_NAME }}
          CACHE_KEY: ${{ vars.LAB_NIX_CACHE_PUBLIC_KEY }}
          CACHE_TOKEN: ${{ secrets.LAB_NIX_CACHE_AUTH_TOKEN }}
        run: |
          test -n "$CACHE_NAME" && test -n "$CACHE_KEY" && test -n "$CACHE_TOKEN" || {
            echo 'Set LAB_NIX_CACHE_NAME, LAB_NIX_CACHE_PUBLIC_KEY and LAB_NIX_CACHE_AUTH_TOKEN before deploying.' >&2
            exit 1
          }
      - name: checkout exact deploy commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            http2 = false
            fallback = true
      - name: configure writable cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.LAB_NIX_CACHE_NAME }}
          authToken: ${{ secrets.LAB_NIX_CACHE_AUTH_TOKEN }}
          useDaemon: false
          skipPush: true
      - name: build and publish every host closure
        id: build
        env:
          CACHE_NAME: ${{ vars.LAB_NIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.LAB_NIX_CACHE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p bootstrap-manifest
          printf '%s\n' "$GITHUB_SHA" > bootstrap-manifest/commit
          mapfile -t hosts < <(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          test "${#hosts[@]}" -gt 0
          systems='{}'
          for host in "${hosts[@]}"; do
            attr=".#nixosConfigurations.${host}.config.system.build.toplevel"
            path="$(nix eval --raw "${attr}.outPath")"
            test -n "$path"
            # cachix uploads a closure concurrently, so a push cut short could
            # leave the toplevel cached without all its references. The host's
            # realise then refuses to switch until the closure is pushed again.
            if nix path-info --store "https://${CACHE_NAME}.cachix.org" "$path" > /dev/null 2>&1; then
              echo "${host}: ${path} is already cached"
            else
              built="$(nix build --no-link --print-out-paths "$attr")"
              test "$built" = "$path"
              cachix push "$CACHE_NAME" "$path"
            fi
            systems="$(jq -c --arg host "$host" --arg path "$path" '. + {($host): $path}' <<<"$systems")"
            printf '%s\n' "$path" > "bootstrap-manifest/${host}"
          done
          echo "systems=${systems}" >> "$GITHUB_OUTPUT"
      - name: upload bootstrap manifest
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-manifest
          path: bootstrap-manifest/
          if-no-files-found: error

  # Lets PR nix-checks substitute unchanged checks. It is kept out of the deploy
  # path so a slow or failing check build never holds up a host switch.
  publish-checks:
    name: build and publish flake checks
    runs-on: ubuntu-latest
    steps:
      - name: checkout exact deploy commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: install nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            http2 = false
            fallback = true
      - name: configure writable cache
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.LAB_NIX_CACHE_NAME }}
          authToken: ${{ secrets.LAB_NIX_CACHE_AUTH_TOKEN }}
          useDaemon: false
          skipPush: true
      - name: build and publish uncached checks
        env:
          CACHE_NAME: ${{ vars.LAB_NIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.LAB_NIX_CACHE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t checks < <(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames | jq -r '.[]')
          for check in "${checks[@]}"; do
            attr=".#checks.x86_64-linux.${check}"
            path="$(nix eval --raw "${attr}.outPath")"
            if nix path-info --store "https://${CACHE_NAME}.cachix.org" "$path" > /dev/null 2>&1; then
              echo "${check}: ${path} is already cached"
            else
              built="$(nix build --no-link --print-out-paths "$attr")"
              test "$built" = "$path"
              cachix push "$CACHE_NAME" "$path"
            fi
          done

  # Infra first: reconcile the Proxmox VMs before rebuilding their configs.
  apply-terraform:
    name: apply-terraform
    needs: build-systems
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    steps:
      - name: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: fourth.ts.alcachofa.faith

      - name: install ssh key
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${{ secrets.FOURTH_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy

      # Repo is pinned to this key by the forced command on fourth, so we only
      # send the job name.
      - name: trigger apply-terraform on the orchestrator
        run: |
          ssh \
            -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            deploy@fourth.ts.alcachofa.faith \
            apply-terraform

  nix-switch:
    name: nix-switch
    needs: [build-systems, apply-terraform]
    runs-on: ubuntu-latest
    steps:
      - name: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: fourth.ts.alcachofa.faith

      - name: install ssh key
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${{ secrets.FOURTH_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 0600 ~/.ssh/deploy

      - name: trigger nix-switch on the orchestrator
        env:
          DEPLOY_SHA: ${{ github.sha }}
          CACHE_NAME: ${{ vars.LAB_NIX_CACHE_NAME }}
          CACHE_KEY: ${{ vars.LAB_NIX_CACHE_PUBLIC_KEY }}
          SYSTEMS: ${{ needs.build-systems.outputs.systems }}
        # Fourth's nix-switch.sh refuses the request unless it names exactly
        # the hosts on its own fixed list.
        run: |
          mapfile -t systems < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' <<<"$SYSTEMS")
          ssh \
            -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            deploy@fourth.ts.alcachofa.faith \
            nix-switch "$DEPLOY_SHA" "$CACHE_NAME" "$CACHE_KEY" "${systems[@]}"
